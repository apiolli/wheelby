# Wheelby completo con un solo comando, desde la raíz del repositorio:
#   docker compose up --build
# Solo la API publica un puerto. Los secretos llegan desde .env (copia de .env.example).

x-postgres-connection: &postgres-connection
  # Se arma aquí para no repetir la contraseña en .env. GSS Encryption Mode=Disable:
  # sin Kerberos, Npgsql no intenta cargar libgssapi_krb5, que la imagen no trae.
  ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Falta POSTGRES_DB en .env};Username=${POSTGRES_USER:?Falta POSTGRES_USER en .env};Password=${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env};GSS Encryption Mode=Disable

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
    # Sin ports: la base no se publica fuera de la composición.
    volumes:
      - wheelby-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    env_file: .env
    restart: unless-stopped
    environment:
      <<: *postgres-connection
      OpenApi__Enabled: "true"
      # Sin estas variables la API no arranca: compose se detiene antes y dice cuál falta.
      App__ActivationUrl: ${App__ActivationUrl:?Falta App__ActivationUrl en .env}
      Jwt__Key: ${Jwt__Key:?Falta Jwt__Key en .env}
      Jwt__Issuer: ${Jwt__Issuer:?Falta Jwt__Issuer en .env}
      Jwt__Audience: ${Jwt__Audience:?Falta Jwt__Audience en .env}
      Admin__Email: ${Admin__Email:?Falta Admin__Email en .env}
      Admin__Password: ${Admin__Password:?Falta Admin__Password en .env}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      # RF-DOC-05: los archivos subidos sobreviven a docker compose down.
      - wheelby-documents:/app/data/documents
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    restart: unless-stopped
    environment:
      <<: *postgres-connection
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  wheelby-pgdata:
  wheelby-documents:
